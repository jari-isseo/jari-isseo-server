# 배포용: Nginx + Spring Boot 앱 + MySQL (#23, #24)
#   인터넷 → nginx(80·443) → app(8080) → mysql(3306)
#   HTTPS 인증서: certbot (처음 한 번 deploy/init-https.sh, 이후 자동 갱신) (#26)
#
# 배포: 내 PC 레포 루트에서  bash deploy/deploy.sh  (jar 빌드 → 업로드 → 재시작, #25)
#
# 서버에서 처음 한 번 (레포 루트에서):
#   cp deploy/.env.example deploy/.env    # 값 채우기 (커밋 금지)
# 서버에서 직접 다시 띄우기 (deploy/app.jar 가 있어야 함):
#   docker compose -f deploy/docker-compose.yml up -d --build
# 상태 / 로그 / 중지:
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml logs -f app
#   docker compose -f deploy/docker-compose.yml restart nginx    # deploy/nginx/ 설정을 고친 뒤
#   docker compose -f deploy/docker-compose.yml down        # 데이터(볼륨)는 남는다
#
# .env 는 이 파일과 같은 폴더(deploy/.env)에서 자동으로 읽는다.
# 로컬 개발용 MySQL 은 docker-compose.dev.yml (프로젝트 이름이 달라서 데이터가 섞이지 않음)
name: jariisseo-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env 의 MYSQL_ROOT_PASSWORD 를 채워주세요}
      MYSQL_DATABASE: ${DB_NAME:-jariisseo}
      # 앱은 root 가 아닌 전용 계정으로 접속 (이 DB 에만 권한)
      MYSQL_USER: ${DB_USERNAME:-jari}
      MYSQL_PASSWORD: ${DB_PASSWORD:?deploy/.env 의 DB_PASSWORD 를 채워주세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M    # 메모리 2GB 서버에 맞게 (기본 128M, 캐시용)
      - --performance-schema=OFF          # 성능 통계 끄기 → 메모리 수백 MB 절약
    # ports 없음: 외부(인터넷)는 물론 서버 호스트에서도 직접 접속 불가. 같은 compose 네트워크의 app 만 접속
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .                 # deploy/ 폴더. deploy.sh 가 올린 app.jar 를 deploy/Dockerfile 로 이미지화
      dockerfile: Dockerfile
    image: jariisseo-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # MySQL 이 접속을 받을 수 있게 된 뒤에 시작
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql                 # compose 서비스 이름 = 내부 주소
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jariisseo}
      DB_USERNAME: ${DB_USERNAME:-jari}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?deploy/.env 의 JWT_SECRET 을 채워주세요}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?deploy/.env 의 PUBLIC_BASE_URL 을 채워주세요}
      JAVA_OPTS: -Xmx512m
      TZ: Asia/Seoul
    ports:
      # 서버 안(127.0.0.1)에서만 열림 (서버에서 curl 로 직접 확인할 때). 인터넷 공개는 nginx 가 맡는다
      - "127.0.0.1:8080:8080"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"        # 인증서 발급·갱신 + HTTPS 로 이동
      - "443:443"      # HTTPS (인증서가 있을 때)
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-}
    # 인증서가 있으면 HTTPS, 없으면 HTTP 설정을 만들어 띄움 (deploy/nginx/start.sh)
    entrypoint: ["/bin/sh", "/opt/jari/start.sh"]
    volumes:
      - ./nginx:/opt/jari:ro                       # 설정은 레포에서 관리
      - letsencrypt:/etc/letsencrypt:ro            # 인증서 (읽기만)
      - certbot-www:/var/www/certbot:ro            # 발급·갱신 확인용 파일

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신 시도 (만료 30일 전부터 실제로 갱신). Nginx 는 6시간마다 다시 읽어서 반영
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done"]

volumes:
  mysql-data:
  letsencrypt:
  certbot-www:
