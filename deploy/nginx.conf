# Nginx 리버스 프록시 (#24): 인터넷(80) → app(8080)
#   docker-compose.yml 의 nginx 서비스가 이 파일을 /etc/nginx/conf.d/default.conf 로 읽는다
#   HTTPS(443)는 5-5 에서 추가

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # app 컨테이너 주소를 요청마다 Docker 내부 DNS 로 다시 찾는다
    #   (app 이 재시작되어 내부 IP 가 바뀌어도 502 가 나지 않도록. proxy_pass 에 변수를 쓰면 이 resolver 를 사용)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8080;

    # 배치 저장 JSON 등 요청 본문 최대 크기 (기본 1MB)
    client_max_body_size 5m;

    # 공통으로 넘겨줄 정보: 원래 요청한 주소·접속한 사람의 IP·http/https
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (API 정의서 5장): 손님 화면 실시간 구독
    #   Nginx 는 기본으로 응답을 모았다가(버퍼링) 보내고, 60초 동안 응답이 없으면 연결을 끊는다.
    #   그러면 이벤트·ping 이 늦게 오거나 연결이 끊기므로 이 경로만 따로 설정한다
    location ~ ^/api/public/stores/[^/]+/events$ {
        proxy_pass $app;
        proxy_http_version 1.1;          # 연결을 계속 열어 두려면 HTTP/1.1
        proxy_set_header Connection '';  # 'close' 를 보내지 않게 비움 → 연결 유지
        proxy_buffering off;             # 받는 즉시 손님에게 전달
        proxy_cache off;
        gzip off;                        # 압축하려고 모아 두지 않게
        proxy_read_timeout 1h;           # 서버의 SSE 타임아웃(30분)보다 길게. 그 사이 20초마다 ping 이 온다
        proxy_send_timeout 1h;

        # location 안에서 proxy_set_header 를 쓰면 위의 공통 헤더가 상속되지 않으므로 다시 적는다
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 모든 요청 (API, 손님 웹 /s/..., /viewer/..., Swagger)
    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
    }
}
