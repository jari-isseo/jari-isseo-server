spring.application.name=jariisseo
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

# DB (값은 .env)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

#---
spring.config.activate.on-profile=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 웹 파일(static) 을 빌드 결과가 아닌 src 폴더에서 바로 읽음 → 수정 후 새로고침만 하면 반영 (#10)
# IntelliJ·gradlew bootRun 모두 레포 루트에서 실행해야 경로가 맞음
spring.web.resources.static-locations=file:src/main/resources/static/
spring.web.resources.cache.period=0
